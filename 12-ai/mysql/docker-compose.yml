services:
  mysql:
    image: mysql:8.0
    container_name: mysql-anomaly
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: