services:
  crdb1:
    image: cockroachdb/cockroach:latest
    container_name: crdb1
    command: start --insecure --join=crdb1,crdb2,crdb3 --advertise-addr=crdb1
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - crdb1:/cockroach/cockroach-data

  crdb2:
    image: cockroachdb/cockroach:latest
    container_name: crdb2
    command: start --insecure --join=crdb1,crdb2,crdb3 --advertise-addr=crdb2
    volumes:
      - crdb2:/cockroach/cockroach-data

  crdb3:
    image: cockroachdb/cockroach:latest
    container_name: crdb3
    command: start --insecure --join=crdb1,crdb2,crdb3 --advertise-addr=crdb3
    volumes:
      - crdb3:/cockroach/cockroach-data

  crdb-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      - crdb1
      - crdb2
      - crdb3
    entrypoint: >
      sh -c "
      echo 'waiting before cockroach init...';
      sleep 10;

      until cockroach init --insecure --host=crdb1:26257; do
        echo 'cockroach init failed or not ready yet, retrying...';
        sleep 3;
      done;

      until cockroach sql --insecure --host=crdb1:26257 -e 'SELECT 1'; do
        echo 'waiting for cockroach sql...';
        sleep 3;
      done;

      cockroach sql --insecure --host=crdb1:26257 -e \"
        CREATE DATABASE IF NOT EXISTS appdb;
        CREATE USER IF NOT EXISTS app;
        GRANT ALL ON DATABASE appdb TO app;
        GRANT ALL ON SCHEMA appdb.public TO app;
      \";

      echo 'cockroach init done';
      "
  redis-master:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  redis-replica1:
    image: redis:7
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis-master

  redis-replica2:
    image: redis:7
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis-master

  redis-sentinel1:
    image: redis:7
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    command: >
      sh -c "
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo 'bind 0.0.0.0' >> /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26379:26379"

  redis-sentinel2:
    image: redis:7
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    command: >
      sh -c "
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo 'bind 0.0.0.0' >> /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "

  redis-sentinel3:
    image: redis:7
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    command: >
      sh -c "
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo 'bind 0.0.0.0' >> /tmp/sentinel.conf &&
      echo 'protected-mode no' >> /tmp/sentinel.conf &&
      echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf
      "
  app1:
    build: ./app
    environment:
      PORT: 3000
      NODE_NAME: app1
      DATABASE_URL: postgres://app@crdb1:26257/appdb?sslmode=disable
      REDIS_SENTINELS: redis-sentinel1:26379,redis-sentinel2:26379,redis-sentinel3:26379
      REDIS_MASTER_NAME: mymaster
    depends_on:
      - crdb-init
      - redis-sentinel1
      - redis-sentinel2
      - redis-sentinel3

  app2:
    build: ./app
    environment:
      PORT: 3000
      NODE_NAME: app2
      DATABASE_URL: postgres://app@crdb1:26257/appdb?sslmode=disable
      REDIS_SENTINELS: redis-sentinel1:26379,redis-sentinel2:26379,redis-sentinel3:26379
      REDIS_MASTER_NAME: mymaster
    depends_on:
      - crdb-init
      - redis-sentinel1
      - redis-sentinel2
      - redis-sentinel3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  crdb1:
  crdb2:
  crdb3:
